<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d17">
<title>Hey Baby Girl · Blackout Date</title>
</head>
<body>
<main id="game" aria-label="Hey Baby Girl">
  <div id="scene" aria-hidden="true"></div>
  <header><div><p class="eyebrow">BLACKOUT DATE</p><h1>Hey Baby Girl<span>.</span></h1></div><button id="restart" type="button" aria-label="Restart game">Restart</button></header>
  <div id="status" aria-live="polite"></div>
  <div id="markers" aria-hidden="true"></div>
  <section id="panel" aria-live="polite">
    <p id="speaker" class="eyebrow"></p><h2 id="line"></h2><button id="continue" type="button"></button>
  </section>
  <div id="touch" hidden>
    <div class="pad" aria-label="Movement">
      <button data-move="ArrowUp" aria-label="Move up">↑</button>
      <button data-move="ArrowLeft" aria-label="Move left">←</button>
      <button data-move="ArrowDown" aria-label="Move down">↓</button>
      <button data-move="ArrowRight" aria-label="Move right">→</button>
    </div>
    <button id="action" type="button">Interact</button>
  </div>
  <footer id="keys"><kbd>WASD</kbd> <kbd>↑↓←→</kbd> Move <kbd>E</kbd> Interact <kbd>R</kbd> Restart</footer>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
