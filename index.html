<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d17">
<title>Hey Baby Girl · Blackout Date</title>
</head>
<body>
<main id="game" aria-label="Hey Baby Girl">
  <div id="scene" aria-hidden="true"></div>
  <div id="darkness" aria-hidden="true"></div>
  <header>
    <div><p class="eyebrow">BLACKOUT DATE</p><h1>Hey Baby Girl<span>.</span></h1></div>
    <div class="header-actions">
      <button id="sound-toggle" type="button" aria-label="Mute sound" aria-pressed="false" hidden>Mute</button>
      <button id="restart" type="button" aria-label="Restart game" hidden>Restart</button>
    </div>
  </header>
  <div id="start-demo" hidden><button id="begin" type="button">Start demo</button></div>
  <div id="status" aria-live="polite" hidden>
    <span id="entity-cue" hidden><img id="entity-portrait" alt=""></span>
    <span id="status-line"></span>
  </div>
  <div id="markers" aria-hidden="true"></div>
  <section id="wake-panel" aria-labelledby="wake-title" hidden>
    <h2 id="wake-title">Wake up</h2>
    <p id="wake-instructions"></p>
    <p id="wake-timer" hidden></p>
    <progress id="wake-meter" aria-labelledby="wake-title" value="0"></progress>
  </section>
  <div id="dialogue" class="dialogue-layer">
    <img id="portrait" class="dialogue-portrait" alt="" hidden>
    <section id="panel" class="dialogue-panel" aria-live="polite">
      <div class="speaker-line">
        <img id="speaker-card" class="speaker-card" alt="" hidden>
        <p id="speaker" class="eyebrow"></p>
      </div>
      <h2 id="line"></h2>
      <div id="date-choices" class="dialogue-choices" role="group" aria-label="Responses">
        <button type="button" data-choice="0"></button>
        <button type="button" data-choice="1"></button>
      </div>
      <button id="continue" type="button" hidden></button>
    </section>
  </div>
  <div id="touch" hidden>
    <div id="thumbstick" role="img" aria-label="Movement thumbstick"><span></span></div>
    <div class="actions" role="group" aria-label="Item actions">
      <button id="table-action" type="button" disabled>Table</button>
      <button id="coats-action" type="button" disabled>Hide</button>
      <button id="inspect-action" type="button" disabled>Inspect</button>
      <button id="latch-action" type="button" disabled>Latch</button>
    </div>
  </div>
  <section id="breach-splash" role="dialog" aria-modal="true" aria-labelledby="breach-title" hidden>
    <img id="breach-art" alt="The heroine turns toward a red-eyed shadow in the apartment doorway">
    <div class="breach-content">
      <h2 id="breach-title">It’s inside.</h2>
      <button id="breach-continue" type="button">Continue</button>
    </div>
  </section>
  <section id="street-ending" aria-labelledby="street-title" hidden>
    <img id="street-art" alt="The heroine checking her phone on an empty, rain-soaked street">
    <div class="street-message">
      <div class="speaker-line">
        <img id="street-speaker-card" class="speaker-card" alt="" hidden>
        <p class="eyebrow" id="street-title">Street level</p>
      </div>
      <p id="phone-message" aria-live="polite"></p>
      <div id="street-choices" class="dialogue-choices" role="group" aria-label="Responses">
        <button type="button" data-choice="0"></button>
        <button type="button" data-choice="1"></button>
      </div>
      <button id="phone-action" type="button" hidden>Retry the street</button>
    </div>
  </section>
  <div id="cinematic-fade" aria-hidden="true"></div>
  <section id="ending-splash" aria-labelledby="ending-title" hidden>
    <div class="ending-artwork">
      <img id="ending-art" alt="The heroine in the rain, seen checking her phone and looking back over her shoulder">
    </div>
    <div class="ending-content">
      <p class="ending-chapter">End of Chapter One</p>
      <h2 id="ending-title">Hey Baby Girl</h2>
      <p class="ending-subtitle">Blackout Date</p>
      <button id="ending-restart" type="button">Restart game</button>
    </div>
  </section>
  <footer id="keys"><kbd>WASD</kbd> <kbd>↑↓←→</kbd> Move <kbd>E</kbd> Interact <kbd>R</kbd> Restart</footer>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
